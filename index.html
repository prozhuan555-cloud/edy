

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Do You Love Me? 💘</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4, #ffecd2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Nunito', sans-serif;
    overflow: hidden;
    position: relative;
  }

  /* Floating hearts background */
  .bg-hearts span {
    position: fixed;
    font-size: 1.5rem;
    animation: floatUp linear infinite;
    opacity: 0;
    pointer-events: none;
    z-index: 0;
  }
  @keyframes floatUp {
    0%   { transform: translateY(110vh) rotate(0deg); opacity: 0.6; }
    100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
  }

  .card {
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(12px);
    border-radius: 32px;
    padding: 3rem 3.5rem;
    text-align: center;
    box-shadow: 0 20px 60px rgba(255,100,120,0.25);
    position: relative;
    z-index: 10;
    max-width: 480px;
    width: 90%;
    animation: popIn 0.6s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  @keyframes popIn {
    from { transform: scale(0.5); opacity: 0; }
    to   { transform: scale(1);   opacity: 1; }
  }

  .emoji-big {
    font-size: 5rem;
    display: block;
    animation: heartbeat 1.2s ease-in-out infinite;
    margin-bottom: 1rem;
  }
  @keyframes heartbeat {
    0%,100% { transform: scale(1); }
    14%     { transform: scale(1.2); }
    28%     { transform: scale(1); }
    42%     { transform: scale(1.15); }
    56%     { transform: scale(1); }
  }

  h1 {
    font-family: 'Pacifico', cursive;
    font-size: 2.4rem;
    color: #e8416a;
    margin-bottom: 0.4rem;
    text-shadow: 2px 2px 0 #ffd6df;
  }
  .sub {
    color: #b0607a;
    font-size: 1rem;
    margin-bottom: 2.2rem;
    font-weight: 700;
  }

  .btn-row {
    display: flex;
    gap: 1.2rem;
    justify-content: center;
    flex-wrap: wrap;
  }

  .btn {
    padding: 0.85rem 2.2rem;
    border: none;
    border-radius: 50px;
    font-size: 1.2rem;
    font-family: 'Nunito', sans-serif;
    font-weight: 900;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .btn:hover { transform: scale(1.07); }

  #yesBtn {
    background: linear-gradient(135deg, #e8416a, #ff6b8a);
    color: #fff;
    box-shadow: 0 6px 20px rgba(232,65,106,0.45);
  }
  #noBtn {
    background: linear-gradient(135deg, #b0bec5, #eceff1);
    color: #607d8b;
    box-shadow: 0 4px 14px rgba(0,0,0,0.1);
    position: fixed; /* so it can escape anywhere on screen */
  }

  /* ---- YES celebration overlay ---- */
  #celebration {
    display: none;
    position: fixed; inset: 0;
    background: linear-gradient(135deg,#ff6b8a,#ffcc02,#a29bfe,#fd79a8);
    background-size: 400% 400%;
    animation: gradShift 2s ease infinite;
    z-index: 100;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  #celebration.show { display: flex; }
  @keyframes gradShift {
    0%,100%{ background-position:0% 50%; }
    50%    { background-position:100% 50%; }
  }
  #celebration h2 {
    font-family: 'Pacifico', cursive;
    font-size: clamp(2.5rem, 8vw, 5rem);
    color: #fff;
    text-shadow: 3px 4px 0 rgba(0,0,0,0.15);
    animation: zoomBounce 0.7s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  @keyframes zoomBounce {
    from { transform: scale(0) rotate(-10deg); opacity: 0; }
    to   { transform: scale(1) rotate(0deg);  opacity: 1; }
  }
  #celebration p {
    margin-top: 1rem;
    font-size: 1.4rem;
    color: rgba(255,255,255,0.92);
    font-weight: 900;
    animation: fadeSlide 0.8s 0.4s both;
  }
  @keyframes fadeSlide {
    from { transform: translateY(20px); opacity: 0; }
    to   { transform: translateY(0);    opacity: 1; }
  }

  .confetti-wrap {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 99;
  }
  .confetti-piece {
    position: absolute;
    top: -20px;
    width: 12px;
    height: 12px;
    border-radius: 2px;
    animation: fall linear forwards;
  }
  @keyframes fall {
    0%   { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }

  #noReaction {
    position: fixed;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%);
    font-size: 2rem;
    pointer-events: none;
    z-index: 50;
    opacity: 0;
    transition: opacity 0.3s;
    white-space: nowrap;
  }
</style>
</head>
<body>

<!-- Floating bg hearts -->
<div class="bg-hearts" id="bgHearts"></div>

<div class="card">
  <span class="emoji-big">💘</span>
  <h1>Do you love me?</h1>
  <p class="sub">Choose wisely… 👀</p>
  <div class="btn-row">
    <button class="btn" id="yesBtn" onclick="celebrate()">Yes 😍</button>
    <button class="btn" id="noBtn" onmouseover="runAway()" onclick="runAway()">No 🙅</button>
  </div>
</div>

<!-- Celebration overlay -->
<div id="celebration">
  <h2>YAY! I KNEW IT! 🎉💖</h2>
  <p>I love you too  ( HGCH Myanmar team and other hot girls 💥❤️🥳</p>
  <p style="margin-top:0.5rem; font-size:1rem; opacity:0.85;">*happy dancing intensifies* 🕺💃</p>
</div>

<div id="noReaction"></div>
<div class="confetti-wrap" id="confettiWrap"></div>

<script>
  // ── Background floating hearts ──
  const bgH = document.getElementById('bgHearts');
  const emojis = ['💕','💗','💓','💞','💖','🌹','💝','🥰'];
  for (let i = 0; i < 18; i++) {
    const s = document.createElement('span');
    s.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    s.style.left = Math.random() * 100 + 'vw';
    s.style.fontSize = (1 + Math.random() * 1.5) + 'rem';
    s.style.animationDuration = (6 + Math.random() * 10) + 's';
    s.style.animationDelay = (Math.random() * 10) + 's';
    bgH.appendChild(s);
  }

  // ── No button: run away ──
  const noBtn = document.getElementById('noBtn');
  const reactions = ['😏 Nope!','😂 Nice try!','🏃 BYE!','😜 Catch me!','🙈 Never!','🤭 Hehe!'];
  let noCount = 0;
  let noBtnSize = 1;

  // Place No button initially
  function placeNoBtnInitial() {
    const card = document.querySelector('.card');
    const r = card.getBoundingClientRect();
    noBtn.style.left = (r.right - noBtn.offsetWidth - 20) + 'px';
    noBtn.style.top  = (r.bottom - noBtn.offsetHeight - 20) + 'px';
  }
  window.addEventListener('load', () => { placeNoBtnInitial(); });

  function runAway() {
    noCount++;
    const margin = 20;
    const maxX = window.innerWidth  - noBtn.offsetWidth  - margin;
    const maxY = window.innerHeight - noBtn.offsetHeight - margin;
    const x = margin + Math.random() * maxX;
    const y = margin + Math.random() * maxY;
    noBtn.style.left = x + 'px';
    noBtn.style.top  = y + 'px';

    // Shrink the No button a bit each time (min 60%)
    noBtnSize = Math.max(0.6, noBtnSize - 0.06);
    noBtn.style.transform = `scale(${noBtnSize})`;
    noBtn.style.transition = 'left 0.25s cubic-bezier(0.34,1.3,0.64,1), top 0.25s cubic-bezier(0.34,1.3,0.64,1)';

    // Show funny reaction
    const r = document.getElementById('noReaction');
    r.textContent = reactions[noCount % reactions.length];
    r.style.opacity = '1';
    clearTimeout(r._t);
    r._t = setTimeout(() => r.style.opacity = '0', 1200);

    // Grow Yes button
    const yesBtn = document.getElementById('yesBtn');
    const scale = Math.min(1 + noCount * 0.08, 2);
    yesBtn.style.transform = `scale(${scale})`;
    yesBtn.style.transition = 'transform 0.3s';

    // After many tries: add pleading text to Yes button
    if (noCount === 3) yesBtn.textContent = 'Yes please!! 🥺';
    if (noCount === 6) yesBtn.textContent = 'YESSS! 😭💕';
  }

  // ── Yes button: celebrate ──
  function celebrate() {
    document.getElementById('celebration').classList.add('show');
    launchConfetti();
    launchEmojiBurst();
  }

  function launchConfetti() {
    const wrap = document.getElementById('confettiWrap');
    const colors = ['#ff6b8a','#ffcc02','#a29bfe','#00cec9','#fd79a8','#55efc4','#e17055','#74b9ff'];
    for (let i = 0; i < 160; i++) {
      const el = document.createElement('div');
      el.className = 'confetti-piece';
      el.style.left = Math.random() * 100 + 'vw';
      el.style.background = colors[Math.floor(Math.random() * colors.length)];
      el.style.width  = (8 + Math.random() * 12) + 'px';
      el.style.height = (8 + Math.random() * 12) + 'px';
      el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
      el.style.animationDuration = (2.5 + Math.random() * 3) + 's';
      el.style.animationDelay   = (Math.random() * 1.5) + 's';
      wrap.appendChild(el);
    }
    setTimeout(() => wrap.innerHTML = '', 6000);
  }

  function launchEmojiBurst() {
    const party = ['🎉','🎊','💖','🥳','✨','💥','🌟','💫','🎈','🌹','🥰'];
    const wrap = document.getElementById('confettiWrap');
    for (let i = 0; i < 40; i++) {
      const el = document.createElement('div');
      el.style.position = 'absolute';
      el.style.fontSize = (1.5 + Math.random() * 2) + 'rem';
      el.style.left = (10 + Math.random() * 80) + 'vw';
      el.style.top  = '-5vh';
      el.textContent = party[Math.floor(Math.random() * party.length)];
      el.style.animation = `fall ${3 + Math.random()*3}s linear ${Math.random()*2}s forwards`;
      el.style.pointerEvents = 'none';
      wrap.appendChild(el);
    }
  }

  // Click anywhere on celebration to dismiss
  document.getElementById('celebration').addEventListener('click', () => {
    document.getElementById('celebration').classList.remove('show');
  });
</script>
